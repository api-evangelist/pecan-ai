name: Pecan AI
description: >-
  Pecan AI is a predictive analytics platform that lets business teams build and
  deploy machine-learning models without data-science expertise. Its AI agents turn
  a business question into a working predictive model, covering customer churn,
  customer lifetime value (LTV), lead scoring, demand forecasting, upsell and
  cross-sell, campaign ROAS, fraud and chargeback prevention, and customer winback.
  Users connect their data (including Databricks and cloud warehouses), let Pecan
  generate and evaluate models, and produce predictions for marketing, sales,
  finance, and operations teams. Pecan is backed by GV and Insight Partners. The
  company operates a SaaS web application and publishes no public developer API,
  SDK, or OpenAPI at this time; this profile captures its identity, security
  posture, and marketing surface.
